<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HUMA</title>
  <link rel="icon" href="img/mark.webp" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="game.css" />
  <script>
    // В Telegram подключаем его мост, в MAX — мост MAX
    document.write(/tgWebAppData|tgWebAppVersion/.test(location.hash + location.search)
      ? '<script src="https://telegram.org/js/telegram-web-app.js"><\/script>'
      : '<script src="https://st.max.ru/js/max-web-app.js"><\/script>');
  </script>
</head>
<body>
  <div id="app" class="app"></div>

  <!-- Нижняя шторка: карточка продукта, история -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true">
      <button class="sheet__close" data-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="game.js"></script>
</body>
</html>
